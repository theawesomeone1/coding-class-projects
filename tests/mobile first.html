<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mobile first</title>
    <style type="text/css">
      body {
        background-image: url("https://i.pinimg.com/736x/b9/a4/2c/b9a42ccb79af7a30c2c190cf2467bb68.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        margin: 0;
      }

      .grid-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px;
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 15px;
      }

      @media (min-width: 480px) {
        .grid-container {
          grid-template-columns: repeat(3, 1fr);
          gap: 5px;
        }
      }

      @media (min-width: 720px) {
        .grid-container {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .card {
        background: black;
        border: 5px solid greenyellow;
        border-radius: 15px;
        overflow: hidden;
        display: flex;
      }

      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      @media (min-width: 0px) and (max-width: 480px) {
        #brain-sign {
          width: auto;
          height: auto;
        }

        .card {
          width: auto;
          height: auto;
          min-height: 185px;
        }
      }

      #brain-sign {
        grid-column: 1 / 2;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="card" id="brain-sign">
        <img
          src="https://i.pinimg.com/1200x/b4/33/45/b433456a5cf3f8e4f0820cc4b1e6966a.jpg"
          alt="metal sign saying the zombies love me for my brains"
          title="they're really good brains"
        />
      </div>
      <div class="card"></div>
      <div class="card"></div>
    </div>
  </body>
</html>
